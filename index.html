<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado da P2 de ResMat - Engenharia de Software Contínua e Experimental</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#281308,#4a2413,#1f2933);color:#fff7ed;padding:20px}
.container{max-width:920px;margin:0 auto} .header{text-align:center;padding:34px 12px 20px}
h1{font-size:2.25rem;margin:0 0 8px;background:linear-gradient(45deg,#fed7aa,#fb923c,#f97316);-webkit-background-clip:text;color:transparent}
.subtitle{color:#ffedd5;margin:0;line-height:1.4} .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badge{border:1px solid rgba(251,146,60,.45);background:rgba(251,146,60,.16);color:#fed7aa;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
.student{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px;margin:18px 0}
.student label{display:block;color:#fdba74;font-weight:700;margin-bottom:7px} input[type=text]{width:100%;padding:11px 13px;border-radius:8px;border:1px solid rgba(251,146,60,.45);background:rgba(0,0,0,.28);color:#fff;font-size:1rem}
.progress{height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:16px 0 5px} .fill{height:100%;width:0;background:linear-gradient(90deg,#fb923c,#ea580c);transition:.25s}
.plabel{text-align:right;color:#fed7aa;font-size:.8rem;margin-bottom:18px}
.q-card{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.09);border-left:4px solid #fb923c;border-radius:12px;padding:22px;margin:16px 0}
.q-card.disc{border-left-color:#facc15} .q-num{font-size:.78rem;text-transform:uppercase;letter-spacing:.9px;color:#fed7aa;margin-bottom:9px} .q-text{line-height:1.55;margin-bottom:15px}
.opts{display:flex;flex-direction:column;gap:8px} .opt{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.20);border:1px solid transparent;border-radius:8px;padding:11px;cursor:pointer}
.opt:hover,.opt.selected{border-color:rgba(251,146,60,.65);background:rgba(251,146,60,.10)} input[type=radio]{accent-color:#fb923c;margin-top:3px}
textarea{width:100%;min-height:105px;resize:vertical;border-radius:8px;border:1px solid rgba(250,204,21,.55);background:rgba(0,0,0,.32);color:#fff;padding:12px;font:inherit;line-height:1.45}
.hint{font-size:.8rem;color:#fed7aa;margin:8px 0 0} .actions{text-align:center;padding:26px 0} button{border:0;border-radius:999px;background:linear-gradient(45deg,#fb923c,#ea580c);color:white;font-weight:800;padding:14px 42px;font-size:1rem;cursor:pointer}
@media print{body{background:white;color:#111} .student,.actions,.progress,.plabel{display:none} .q-card{break-inside:avoid;border:1px solid #ccc;color:#111} h1{color:#111;background:none} .subtitle,.q-num{color:#333} textarea{border:1px solid #999;color:#111}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Simulado da P2 de ResMat</h1>
    <p class="subtitle">Disciplina: Engenharia de Software Contínua e Experimental<br>Resistência dos Materiais: tensões, deformações, torção, vigas, energia e propriedades mecânicas</p>
    <div class="badges"><span class="badge">20 objetivas</span><span class="badge">10 discursivas</span><span class="badge">Feedback editável</span><span class="badge">PDF para AVA</span></div>
  </header>
  <div class="student"><label for="student">Nome do aluno</label><input id="student" type="text" placeholder="Digite o nome completo"></div>
  <div class="progress"><div class="fill" id="fill"></div></div><div class="plabel" id="plabel">0 de 30 respondidas</div>
  <form id="quiz"></form>
</div>
<script>
const DATA = {"mc": [{"tema": "Tensão e deformação", "q": "Em uma barra submetida a carga axial centrada, a tensão normal média é obtida por:", "opts": ["sigma = P/A", "tau = T*rho/J", "epsilon = Delta L/L0", "U = P*y/2", "V = dM/dx"], "c": 0, "exp": "A tensão normal média em carregamento axial é a força normal dividida pela área da seção transversal."}, {"tema": "Tensão e deformação", "q": "A deformação normal de engenharia representa:", "opts": ["a razão entre o alongamento ou encurtamento e o comprimento inicial da barra.", "o torque máximo dividido pelo momento polar de inércia.", "a força cortante resultante em uma seção.", "a área sob o diagrama de corpo livre.", "o produto entre carga e distância ao apoio."], "c": 0, "exp": "A deformação normal é epsilon = Delta L/L0, indicando variação relativa de comprimento."}, {"tema": "Lei de Hooke", "q": "No regime elástico linear, a Lei de Hooke para tensão normal relaciona:", "opts": ["sigma e epsilon por meio do módulo E.", "tau e temperatura por meio do peso específico.", "momento e força cortante por meio da densidade.", "torque e comprimento por meio da área.", "resiliência e tenacidade por meio do coeficiente de Poisson."], "c": 0, "exp": "No regime elástico linear, sigma = E*epsilon."}, {"tema": "Propriedades mecânicas", "q": "Em uma curva tensão-deformação, a tenacidade está associada:", "opts": ["à área total sob a curva até a ruptura.", "apenas à inclinação inicial da curva.", "ao menor valor de tensão admissível.", "à reação vertical no apoio.", "ao ângulo de torção por unidade de comprimento."], "c": 0, "exp": "Tenacidade é a capacidade de absorver energia até a fratura, representada pela área sob a curva tensão-deformação."}, {"tema": "Propriedades mecânicas", "q": "A ductilidade de um material indica principalmente sua capacidade de:", "opts": ["sofrer deformação plástica antes da ruptura.", "retornar energia elástica sem deformar.", "resistir apenas a torção circular.", "eliminar tensões de cisalhamento.", "anular o módulo de elasticidade."], "c": 0, "exp": "Materiais dúcteis apresentam deformação plástica significativa antes da fratura."}, {"tema": "Cisalhamento", "q": "A tensão média de cisalhamento em uma seção pode ser representada por:", "opts": ["tau_med = V/A", "sigma = M*c/I", "epsilon = sigma*E", "phi = J*G/(T*L)", "U = integral M dx"], "c": 0, "exp": "Em cisalhamento simples médio, divide-se a força cortante pela área resistente ao cisalhamento."}, {"tema": "Cisalhamento em conexões", "q": "Um pino em cisalhamento duplo, para a mesma força total, tende a apresentar tensão média:", "opts": ["menor que no cisalhamento simples, pois há duas áreas resistentes.", "maior que no cisalhamento simples, pois só existe uma área resistente.", "igual à tensão normal por flexão.", "independente da área do pino.", "sempre nula nos planos de corte."], "c": 0, "exp": "No cisalhamento duplo a força é distribuída em dois planos de corte, aumentando a área resistente."}, {"tema": "Torção", "q": "Para um eixo circular elástico submetido a torque T, a tensão de cisalhamento máxima ocorre:", "opts": ["na superfície externa do eixo.", "no centro da seção.", "somente na linha neutra de flexão.", "no apoio mais próximo.", "em qualquer ponto com o mesmo valor."], "c": 0, "exp": "Na torção circular, tau = T*rho/J, logo a tensão cresce com a distância rho ao centro."}, {"tema": "Torção", "q": "O momento polar de inércia J é usado principalmente em problemas de:", "opts": ["torção de eixos circulares.", "tração em cabos flexíveis.", "equilíbrio de partículas sem rotação.", "cálculo de massa específica.", "classificação química de materiais."], "c": 0, "exp": "J caracteriza a resistência geométrica da seção circular à torção."}, {"tema": "Torção", "q": "No regime elástico, o ângulo de torção de um eixo circular depende diretamente de:", "opts": ["torque e comprimento do eixo.", "módulo de elasticidade E e área apenas.", "massa do material e cor da superfície.", "força cortante vertical apenas.", "tenacidade e ductilidade somente."], "c": 0, "exp": "Para eixo circular, phi = T*L/(J*G), dependendo diretamente de T e L."}, {"tema": "Diagramas internos", "q": "Em uma viga, o diagrama de corpo livre é importante porque:", "opts": ["isola a estrutura ou trecho para determinar reações e esforços internos.", "substitui a necessidade das equações de equilíbrio.", "mostra apenas propriedades químicas do material.", "elimina força cortante e momento fletor.", "serve somente para calcular deformação térmica."], "c": 0, "exp": "O DCL permite aplicar equilíbrio e encontrar reações, força normal, cortante, momento fletor e torque."}, {"tema": "Força cortante e momento fletor", "q": "Em diagramas de vigas, a força cortante e o momento fletor são usados para:", "opts": ["identificar regiões críticas para o dimensionamento da seção.", "definir a composição química do aço.", "calcular apenas o peso próprio da viga.", "determinar somente o ângulo de torção.", "substituir todos os ensaios mecânicos."], "c": 0, "exp": "Valores máximos de V e M orientam verificações de cisalhamento e flexão."}, {"tema": "Flexão", "q": "Na flexão elástica de uma viga, a tensão normal máxima pode ser expressa por:", "opts": ["sigma_max = M*c/I", "tau = P/A", "epsilon = T/J", "G = E/(1+nu)", "U = m*v²"], "c": 0, "exp": "A fórmula da flexão relaciona momento fletor, distância à linha neutra e momento de inércia."}, {"tema": "Projeto de vigas", "q": "No projeto de uma viga prismática, uma estratégia comum é escolher a seção a partir:", "opts": ["do módulo resistente mínimo exigido pelo momento máximo e pela tensão admissível.", "da maior deformação plástica possível.", "da menor área visual disponível, sem cálculo.", "do torque de eixo circular somente.", "da cor do material no catálogo."], "c": 0, "exp": "Para flexão, usa-se S_min = |M|max/sigma_adm para selecionar uma seção adequada."}, {"tema": "Projeto de eixos", "q": "Em eixos circulares de transmissão, normalmente se verifica:", "opts": ["torção, tensões de cisalhamento e ângulo de torção admissível.", "apenas tração axial uniforme.", "somente curvas de resiliência.", "apenas dureza superficial.", "somente peso específico do material."], "c": 0, "exp": "Eixos transmitem torque, por isso exigem verificação de cisalhamento e deformação angular."}, {"tema": "Métodos de energia", "q": "A energia de deformação em uma barra ou viga representa:", "opts": ["a energia armazenada pelo corpo deformável devido aos esforços aplicados.", "a energia química liberada pelo material.", "a massa total multiplicada pela área.", "o somatório das reações horizontais.", "a distância entre apoios ao quadrado."], "c": 0, "exp": "Corpos elásticos armazenam energia durante a deformação produzida por forças, momentos ou torques."}, {"tema": "Métodos de energia", "q": "Para uma força aplicada gradualmente em regime linear, a energia de deformação pode ser associada a:", "opts": ["U = 1/2 P*y.", "U = P/A.", "U = V/A.", "U = T*rho/J.", "U = sigma/E."], "c": 0, "exp": "Quando a relação força-deslocamento é linear, o trabalho armazenado corresponde à área triangular sob a curva P-y."}, {"tema": "Castigliano", "q": "O teorema de Castigliano permite determinar deslocamentos ou rotações por meio:", "opts": ["da derivada parcial da energia de deformação em relação à força ou momento correspondente.", "da soma direta das massas dos elementos.", "da substituição do módulo E por zero.", "da área externa pintada do material.", "da curva de resfriamento do aço."], "c": 0, "exp": "Castigliano relaciona deslocamentos generalizados às derivadas parciais da energia de deformação."}, {"tema": "Impacto", "q": "Em carregamentos por impacto, quando se desprezam perdas e comportamento não linear, a análise costuma comparar:", "opts": ["energia cinética ou potencial do impacto com energia de deformação da estrutura.", "apenas tensão média com densidade.", "a cor do material com sua tenacidade.", "somente torque com área transversal.", "a temperatura ambiente com força cortante."], "c": 0, "exp": "A energia do impacto é convertida em energia de deformação para estimar esforços e tensões máximas."}, {"tema": "Materiais", "q": "Materiais frágeis, quando comparados a materiais dúcteis, geralmente apresentam:", "opts": ["pequena deformação plástica antes da ruptura.", "grande patamar de escoamento e elevado alongamento.", "ausência completa de tensão normal.", "cisalhamento sempre nulo.", "mesma tenacidade de qualquer aço baixo carbono."], "c": 0, "exp": "Materiais frágeis rompem com pouca deformação plástica, enquanto materiais dúcteis deformam mais antes da ruptura."}], "disc": [{"tema": "Tensão e deformação", "q": "Explique a diferença entre tensão normal, tensão de cisalhamento e deformação normal.", "req": ["normal", "cisalhamento", "deformacao", "area", "comprimento"], "exp": "Tensão normal atua perpendicularmente à seção; cisalhamento atua tangencialmente; deformação normal mede variação relativa de comprimento."}, {"tema": "Lei de Hooke", "q": "Descreva as condições para aplicar a Lei de Hooke em um material.", "req": ["elastico", "linear", "proporcional", "tensao", "deformacao"], "exp": "A Lei de Hooke é válida no regime elástico linear, antes do escoamento, quando tensão e deformação são proporcionais."}, {"tema": "Propriedades mecânicas", "q": "Compare ductilidade, tenacidade e resiliência em uma curva tensão-deformação.", "req": ["ductilidade", "tenacidade", "resiliencia", "curva", "energia"], "exp": "Ductilidade é capacidade de deformar plasticamente; tenacidade é energia até a ruptura; resiliência é energia recuperável no regime elástico."}, {"tema": "Conexões", "q": "Explique por que um pino pode estar em cisalhamento simples ou duplo e como isso altera a área resistente.", "req": ["pino", "simples", "duplo", "area", "forca"], "exp": "No cisalhamento simples há um plano de corte; no duplo há dois planos, aumentando a área resistente para a mesma força."}, {"tema": "Torção", "q": "Explique por que a tensão de cisalhamento em um eixo circular é maior na superfície externa.", "req": ["torcao", "raio", "rho", "superficie", "J"], "exp": "Como tau = T*rho/J, a tensão cresce com a distância ao centro e atinge valor máximo no raio externo."}, {"tema": "Torção", "q": "Relacione torque, módulo de elasticidade transversal, momento polar e ângulo de torção.", "req": ["torque", "G", "J", "angulo", "comprimento"], "exp": "No regime elástico, phi = T L/(J G); maior torque e comprimento aumentam a rotação, enquanto maior J e G reduzem a rotação."}, {"tema": "Vigas", "q": "Explique como os diagramas de força cortante e momento fletor ajudam no projeto de vigas.", "req": ["cortante", "momento", "maximo", "secao", "dimensionamento"], "exp": "Os diagramas identificam valores máximos de V e M, que orientam as verificações de cisalhamento, flexão e escolha da seção."}, {"tema": "Flexão", "q": "Descreva o papel da linha neutra e da distância c na fórmula sigma = M c / I.", "req": ["linha neutra", "distancia", "momento", "inercia", "tensao"], "exp": "A tensão de flexão varia com a distância à linha neutra; c é a maior distância até a fibra extrema usada para a tensão máxima."}, {"tema": "Energia", "q": "Explique a ideia de energia de deformação para uma força aplicada gradualmente.", "req": ["energia", "deformacao", "forca", "deslocamento", "linear"], "exp": "A energia armazenada é o trabalho da força durante o deslocamento; em comportamento linear, corresponde a 1/2 P y."}, {"tema": "Castigliano", "q": "Explique, em palavras, como o teorema de Castigliano pode ser usado para encontrar uma deflexão.", "req": ["Castigliano", "derivada", "energia", "forca", "deflexao"], "exp": "Calcula-se a energia de deformação e deriva-se parcialmente em relação à força aplicada no ponto e direção da deflexão desejada."}]};
const total = DATA.mc.length + DATA.disc.length;
const quiz = document.getElementById('quiz');
function escapeHtml(s){return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function norm(s){return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function render(){
  let html = '';
  DATA.mc.forEach((q, idx) => {
    const n = idx + 1;
    const opts = q.opts.map((opt,i)=>`<label class="opt"><input type="radio" name="q${n}" value="${i}"><span><b>${String.fromCharCode(65+i)})</b> ${escapeHtml(opt)}</span></label>`).join('');
    html += `<section class="q-card" data-type="mc" data-answer="${q.c}" data-exp="${escapeHtml(q.exp)}" data-tema="${escapeHtml(q.tema)}">
      <div class="q-num">Questão ${String(n).padStart(2,'0')} • ${escapeHtml(q.tema)}</div><div class="q-text">${escapeHtml(q.q)}</div><div class="opts">${opts}</div></section>`;
  });
  DATA.disc.forEach((q, idx) => {
    const n = DATA.mc.length + idx + 1;
    html += `<section class="q-card disc" data-type="disc" data-req="${escapeHtml(q.req.join(','))}" data-exp="${escapeHtml(q.exp)}" data-tema="${escapeHtml(q.tema)}">
      <div class="q-num">Questão ${String(n).padStart(2,'0')} • ${escapeHtml(q.tema)}</div><div class="q-text">${escapeHtml(q.q)}</div><textarea name="q${n}" placeholder="Digite sua resposta..."></textarea><p class="hint">Correção automática parcial por palavras-chave. O professor pode revisar a resposta final.</p></section>`;
  });
  html += '<div class="actions"><button type="button" onclick="corrigir()">Finalizar simulado</button></div>';
  quiz.innerHTML = html;
  document.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', e => {e.target.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.remove('selected')); e.target.closest('.opt').classList.add('selected'); updateProgress();}));
  document.querySelectorAll('textarea').forEach(t => t.addEventListener('input', updateProgress));
}
function updateProgress(){
  let answered=0;
  document.querySelectorAll('.q-card').forEach((card,i)=>{ if(card.dataset.type==='mc'){ if(document.querySelector(`input[name=q${i+1}]:checked`)) answered++; } else { if(card.querySelector('textarea').value.trim().length>10) answered++; } });
  document.getElementById('fill').style.width = (answered/total*100)+'%';
  document.getElementById('plabel').textContent = `${answered} de ${total} respondidas`;
}
function corrigir(){
  let score=0, rows=[];
  document.querySelectorAll('.q-card').forEach((card,i)=>{
    const n=i+1, pergunta=card.querySelector('.q-text').textContent.trim(), tema=card.dataset.tema;
    if(card.dataset.type==='mc'){
      const chosen=document.querySelector(`input[name=q${n}]:checked`);
      const ok=chosen && Number(chosen.value)===Number(card.dataset.answer);
      if(ok) score++;
      const marcada = chosen ? String.fromCharCode(65+Number(chosen.value)) : 'Não respondida';
      const gabarito = String.fromCharCode(65+Number(card.dataset.answer));
      rows.push(`<section class="r ${ok?'ok':''}"><h3>Questão ${String(n).padStart(2,'0')} <span>${escapeHtml(tema)}</span></h3><p><strong>Enunciado:</strong> ${escapeHtml(pergunta)}</p><p><strong>Resposta marcada:</strong> ${escapeHtml(marcada)} | <strong>Gabarito:</strong> ${gabarito} | <strong>Status:</strong> ${ok?'Correta':'Incorreta ou não respondida'}</p><p class="small"><strong>Feedback:</strong> ${escapeHtml(card.dataset.exp)}</p></section>`);
    } else {
      const originalTxt=card.querySelector('textarea').value.trim(), txt=norm(originalTxt), req=card.dataset.req.split(',');
      const hits=req.filter(k=>txt.includes(norm(k))).length, ok=hits>=2;
      if(ok) score++;
      rows.push(`<section class="r ${ok?'ok':''}"><h3>Questão ${String(n).padStart(2,'0')} <span>${escapeHtml(tema)}</span></h3><p><strong>Enunciado:</strong> ${escapeHtml(pergunta)}</p><p><strong>Status automático:</strong> ${ok?'Resposta com indícios suficientes':'Revisar manualmente'} (${hits} palavra(s)-chave encontrada(s)).</p><p><strong>Resposta do aluno:</strong></p><div class="answer">${escapeHtml(originalTxt || 'Não respondida')}</div><p class="small"><strong>Referência esperada:</strong> ${escapeHtml(card.dataset.exp)}</p></section>`);
    }
  });
  const pct=Math.round(score/total*100), name=document.getElementById('student').value.trim() || 'Aluno', now=new Date().toLocaleString('pt-BR');
  const report = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feedback - Simulado da P2 de ResMat - ${escapeHtml(name)}</title><style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f4f6;color:#111827;line-height:1.45} .toolbar{position:sticky;top:0;background:#111827;color:white;padding:12px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.18)} .toolbar p{margin:0;font-size:.9rem;color:#d1d5db} button{border:0;border-radius:8px;background:#ea580c;color:white;font-weight:700;padding:10px 16px;cursor:pointer} .wrap{max-width:900px;margin:24px auto;background:white;padding:34px;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.10)} .bottom-actions{max-width:900px;margin:0 auto 32px;text-align:center} .bottom-actions button{font-size:16px;padding:13px 24px} .editable{outline:2px dashed transparent} .editable:focus{outline-color:#ea580c} h1{margin:0 0 8px;text-align:center;font-size:24px} .meta{border:1px solid #d1d5db;border-radius:8px;padding:14px;margin:18px 0;background:#f9fafb} .score{font-size:30px;font-weight:800;text-align:center;color:#c2410c;margin:18px 0} .note{font-size:13px;color:#4b5563;text-align:center} .r{border:1px solid #d1d5db;border-left:5px solid #dc2626;border-radius:8px;padding:14px 16px;margin:14px 0;break-inside:avoid} .r.ok{border-left-color:#16a34a} h3{margin:0 0 8px;font-size:17px} h3 span{font-size:12px;color:#6b7280;font-weight:400;margin-left:8px} .small{color:#374151;font-size:13px} .answer{white-space:pre-wrap;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:10px;margin-top:4px} @media print{body{background:white} .toolbar,.bottom-actions{display:none} .wrap{box-shadow:none;margin:0;max-width:none;border-radius:0;padding:18px} .editable{outline:none}}</style></head><body>
<div class="toolbar"><p>Revise/edite o relatório antes de gerar o PDF para entrega no AVA.</p><button onclick="window.print()">Gerar PDF para o AVA</button></div>
<main class="wrap editable" contenteditable="true"><h1>Feedback - Simulado da P2 de ResMat</h1><div class="meta"><p><strong>Aluno:</strong> ${escapeHtml(name)}</p><p><strong>Data/Hora:</strong> ${escapeHtml(now)}</p><p><strong>Disciplina:</strong> Engenharia de Software Contínua e Experimental</p><p><strong>Conteúdos:</strong> Resistência dos Materiais, propriedades mecânicas, tensão, deformação, torção, vigas e métodos de energia.</p></div><div class="score">${score}/${total} (${pct}%)</div><p class="note">As questões discursivas usam correção automática parcial por palavras-chave e podem ser revisadas pelo professor antes da nota final.</p>${rows.join('')}</main><div class="bottom-actions"><button onclick="window.print()">Gerar PDF para o AVA</button></div></body></html>`;
  const w=window.open('', '_blank');
  if(!w){ alert('O navegador bloqueou a nova aba. Libere pop-ups para este site e clique novamente.'); return; }
  w.document.open(); w.document.write(report); w.document.close();
}
